# Verificación y publicación de la app.
#
# - verificar: en cada push y Pull Request corre lint, pruebas y build.
# - publicar: si la verificación pasa en `main`, publica la app en GitHub
#   Pages. La página solo entrega el programa: los datos siguen en la carpeta
#   (bóveda) del equipo de cada usuario y nunca se suben.
#
# Requisito único: en GitHub, Settings → Pages → Source: "GitHub Actions".

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la verificación anterior en curso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build

      - name: Guardar el build para Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    name: Publicar en GitHub Pages
    needs: verificar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    # Nunca dos publicaciones a la vez, pero sin cancelar una ya iniciada.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v5
